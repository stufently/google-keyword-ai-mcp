[[faq]]
q = "How do I install Google Keyword Intelligence?"
a = "It needs Python 3.12 or newer and uv. Clone the repository, run uv sync, then uv run gkai doctor --format json. Add uv sync --extra ads or --extra gsc for the optional Google Ads and Search Console clients."

[[faq]]
q = "Do I need Google credentials to use it?"
a = "No for Autocomplete and Trends, which work without account credentials. Google Ads requires your own developer token, customer ID and OAuth client values, and Search Console requires your own service-account or authorized-user credential file."

[[faq]]
q = "How do I connect it to Claude Code?"
a = "Add a project .mcp.json with a stdio server named google-keyword-ai that runs uv run google-keyword-ai, and start Claude Code from the repository so uv resolves the project."

[[faq]]
q = "Does competitor research show the keywords a competitor ranks for?"
a = "No. A site seed returns ideas Google Ads associates with that site. It does not reveal queries the competitor ranks for, organic positions or traffic."

[[faq]]
q = "Are Trends values search volumes?"
a = "No. Trends values are relative 0–100 interest within one response. Autocomplete and Trends use unofficial Google endpoints with no availability or compatibility guarantee."

[[faq]]
q = "Is this an official Google tool?"
a = "No. The project is not affiliated with or endorsed by Google, and it is released under the MIT license."
