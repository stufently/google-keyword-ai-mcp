[project]
name = "google-keyword-ai"
version = "0.1.0"
description = "CLI, MCP server and agent skill for collecting and analyzing Google search-demand data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "mcp>=2.1.1",
    "anyio>=4.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
ads = ["google-ads>=31.4.0"]
gsc = ["google-api-python-client>=2.200.0", "google-auth-oauthlib>=1.4.1"]
all = [
    "google-ads>=31.4.0",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
]

[project.scripts]
gkai = "google_keyword_ai.cli.main:main"
google-keyword-ai = "google_keyword_ai.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_keyword_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: live network tests, opt-in only"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Milestone specs are an archive of what was asked for at the time; ruff would
# reformat the Python snippets inside them and make the record diverge from what
# was actually handed to the implementer.
extend-exclude = ["docs/specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
